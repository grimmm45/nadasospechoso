<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Una flor para ti 🌻</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Georgia, 'Times New Roman', serif;
    background:
        radial-gradient(circle at 50% 20%,
        #fff9c4 0%,
        #ffe082 20%,
        #ffca28 45%,
        #f9a825 70%,
        #e65100 100%);
    color:white;
    position:relative;
}

/* BRILLO DEL FONDO */

body::before{
    content:"";
    position:fixed;
    inset:-50%;
    background:
        radial-gradient(circle,
        rgba(255,255,255,.25) 0%,
        rgba(255,193,7,.12) 30%,
        transparent 65%);
    animation:brilloFondo 8s ease-in-out infinite alternate;
    pointer-events:none;
}

@keyframes brilloFondo{
    from{
        transform:scale(.9) rotate(0deg);
        opacity:.5;
    }
    to{
        transform:scale(1.2) rotate(20deg);
        opacity:1;
    }
}

/* ESTRELLAS */

.estrellas{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.estrella{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    box-shadow:
        0 0 8px white,
        0 0 15px #fff59d;
    animation:parpadear 2s infinite alternate;
}

.estrella:nth-child(1){top:10%;left:12%;animation-delay:.2s;}
.estrella:nth-child(2){top:18%;left:28%;animation-delay:1s;}
.estrella:nth-child(3){top:8%;left:75%;animation-delay:.5s;}
.estrella:nth-child(4){top:25%;left:88%;animation-delay:1.4s;}
.estrella:nth-child(5){top:40%;left:8%;animation-delay:.8s;}
.estrella:nth-child(6){top:35%;left:93%;animation-delay:1.8s;}
.estrella:nth-child(7){top:55%;left:18%;animation-delay:.3s;}
.estrella:nth-child(8){top:48%;left:82%;animation-delay:1.2s;}
.estrella:nth-child(9){top:15%;left:55%;animation-delay:.7s;}
.estrella:nth-child(10){top:65%;left:90%;animation-delay:1.6s;}
.estrella:nth-child(11){top:30%;left:45%;animation-delay:.9s;}
.estrella:nth-child(12){top:70%;left:6%;animation-delay:1.3s;}

@keyframes parpadear{
    from{
        opacity:.2;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1.5);
    }
}

/* LUCES */

.luces{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.luz{
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#fffde7;
    box-shadow:
        0 0 10px #fff,
        0 0 25px #fff176,
        0 0 45px #ffd54f;
    animation:flotarLuz 7s ease-in-out infinite;
    opacity:.7;
}

.luz:nth-child(1){
    left:15%;
    top:70%;
    animation-delay:0s;
}

.luz:nth-child(2){
    left:30%;
    top:50%;
    animation-delay:2s;
}

.luz:nth-child(3){
    left:70%;
    top:60%;
    animation-delay:4s;
}

.luz:nth-child(4){
    left:85%;
    top:35%;
    animation-delay:1s;
}

.luz:nth-child(5){
    left:50%;
    top:75%;
    animation-delay:3s;
}

@keyframes flotarLuz{
    0%,100%{
        transform:translateY(0) scale(.8);
        opacity:.3;
    }
    50%{
        transform:translateY(-50px) scale(1.3);
        opacity:1;
    }
}

/* CONTENEDOR PRINCIPAL */

.contenedor{
    position:relative;
    z-index:5;
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}

/* TITULO */

.titulo{
    margin-bottom:5px;
    animation:aparecer 2s ease forwards;
}

.titulo h1{
    font-size:clamp(30px,7vw,55px);
    color:white;
    text-shadow:
        0 0 10px #fff,
        0 0 20px #ffd54f,
        0 0 35px #ffb300;
    margin-bottom:5px;
}

.titulo p{
    font-size:clamp(15px,3vw,21px);
    color:#fffde7;
    text-shadow:0 2px 5px rgba(0,0,0,.3);
}

/* FLOR GRANDE */

.flor{
    position:relative;
    width:190px;
    height:250px;
    margin:5px 0 0;
    animation:flotar 4s ease-in-out infinite;
}

@keyframes flotar{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

/* TALLO */

.tallo{
    position:absolute;
    width:12px;
    height:130px;
    background:linear-gradient(
        to right,
        #33691e,
        #66bb6a,
        #33691e
    );
    left:89px;
    top:105px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(51,105,30,.6);
}

/* HOJAS */

.hoja{
    position:absolute;
    width:70px;
    height:35px;
    background:linear-gradient(
        135deg,
        #81c784,
        #388e3c
    );
    border-radius:100% 0 100% 0;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.hoja.izquierda{
    left:28px;
    top:165px;
    transform:rotate(-25deg);
}

.hoja.derecha{
    right:28px;
    top:190px;
    transform:rotate(205deg);
}

/* CENTRO DE LA FLOR */

.centro{
    position:absolute;
    width:75px;
    height:75px;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            #6d4c41 0%,
            #4e342e 45%,
            #3e2723 100%
        );
    left:57px;
    top:65px;
    z-index:5;
    box-shadow:
        inset 0 0 15px rgba(0,0,0,.7),
        0 0 15px rgba(255,193,7,.7);
}

/* PETALOS */

.petalo{
    position:absolute;
    width:58px;
    height:100px;
    background:linear-gradient(
        to bottom,
        #fff176,
        #ffd600,
        #ffb300
    );
    border-radius:50% 50% 45% 45%;
    left:66px;
    top:5px;
    transform-origin:29px 98px;
    box-shadow:
        inset 0 0 12px rgba(255,255,255,.5),
        0 4px 15px rgba(245,124,0,.3);
}

.petalo:nth-child(1){
    transform:rotate(0deg);
}

.petalo:nth-child(2){
    transform:rotate(45deg);
}

.petalo:nth-child(3){
    transform:rotate(90deg);
}

.petalo:nth-child(4){
    transform:rotate(135deg);
}

.petalo:nth-child(5){
    transform:rotate(180deg);
}

.petalo:nth-child(6){
    transform:rotate(225deg);
}

.petalo:nth-child(7){
    transform:rotate(270deg);
}

.petalo:nth-child(8){
    transform:rotate(315deg);
}

/* MENSAJE */

.mensaje{
    width:min(650px,90vw);
    margin-top:0;
    padding:18px 25px;
    border-radius:20px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.3);
    box-shadow:
        0 8px 30px rgba(0,0,0,.15),
        inset 0 0 20px rgba(255,255,255,.1);
    animation:aparecer 2.5s ease forwards;
}

.mensaje p{
    white-space:pre-line;
    font-size:clamp(15px,2.7vw,19px);
    line-height:1.6;
    color:#fff;
    text-shadow:0 1px 4px rgba(0,0,0,.4);
}

/* FELIZ DIA */

.feliz-dia{
    display:block;
    margin-top:15px;
    font-size:clamp(24px,5vw,38px);
    font-weight:bold;
    color:#fffde7;
    text-shadow:
        0 0 8px #fff,
        0 0 18px #fff176,
        0 0 30px #ffd54f,
        0 0 45px #ffb300;
    animation:felizBrillo 1.8s ease-in-out infinite alternate;
}

@keyframes felizBrillo{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.06);
    }
}

/* BOTON */

button{
    margin-top:12px;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:linear-gradient(
        135deg,
        #fff176,
        #ffd54f,
        #ffb300
    );
    color:#5d4037;
    font-size:16px;
    font-family:inherit;
    font-weight:bold;
    cursor:pointer;
    box-shadow:
        0 5px 20px rgba(0,0,0,.2),
        0 0 15px rgba(255,235,59,.6);
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
    box-shadow:
        0 8px 25px rgba(0,0,0,.25),
        0 0 30px rgba(255,235,59,.9);
}

/* FLORES PEQUEÑAS */

.campo{
    position:fixed;
    bottom:-5px;
    left:0;
    width:100%;
    height:100px;
    z-index:2;
    pointer-events:none;
}

.florPequena{
    position:absolute;
    bottom:0;
    width:80px;
    height:100px;
}

.florPequena .talloP{
    position:absolute;
    bottom:0;
    left:39px;
    width:5px;
    height:65px;
    background:#388e3c;
    border-radius:5px;
}

.florPequena .cabeza{
    position:absolute;
    top:10px;
    left:25px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:#5d4037;
    z-index:2;
}

.florPequena .petaloP{
    position:absolute;
    top:0;
    left:29px;
    width:22px;
    height:38px;
    border-radius:50%;
    background:linear-gradient(
        to bottom,
        #fff176,
        #ffc107
    );
    transform-origin:11px 30px;
}

.florPequena .petaloP:nth-child(1){
    transform:rotate(0deg);
}

.florPequena .petaloP:nth-child(2){
    transform:rotate(60deg);
}

.florPequena .petaloP:nth-child(3){
    transform:rotate(120deg);
}

.florPequena .petaloP:nth-child(4){
    transform:rotate(180deg);
}

.florPequena .petaloP:nth-child(5){
    transform:rotate(240deg);
}

.florPequena .petaloP:nth-child(6){
    transform:rotate(300deg);
}

.florPequena:nth-child(1){
    left:2%;
    transform:scale(.8);
}

.florPequena:nth-child(2){
    left:12%;
    transform:scale(1);
}

.florPequena:nth-child(3){
    left:23%;
    transform:scale(.7);
}

.florPequena:nth-child(4){
    left:35%;
    transform:scale(.9);
}

.florPequena:nth-child(5){
    left:47%;
    transform:scale(.75);
}

.florPequena:nth-child(6){
    left:60%;
    transform:scale(1);
}

.florPequena:nth-child(7){
    left:72%;
    transform:scale(.7);
}

.florPequena:nth-child(8){
    left:83%;
    transform:scale(.9);
}

.florPequena:nth-child(9){
    left:94%;
    transform:scale(.75);
}

/* PETALOS QUE CAEN */

.caida{
    position:fixed;
    top:-30px;
    width:15px;
    height:22px;
    background:#ffd54f;
    border-radius:100% 0 100% 0;
    opacity:.8;
    z-index:3;
    animation:caer linear infinite;
}

.caida:nth-child(1){
    left:10%;
    animation-duration:8s;
    animation-delay:1s;
}

.caida:nth-child(2){
    left:25%;
    animation-duration:10s;
    animation-delay:3s;
}

.caida:nth-child(3){
    left:40%;
    animation-duration:7s;
    animation-delay:0s;
}

.caida:nth-child(4){
    left:60%;
    animation-duration:9s;
    animation-delay:2s;
}

.caida:nth-child(5){
    left:75%;
    animation-duration:11s;
    animation-delay:4s;
}

.caida:nth-child(6){
    left:90%;
    animation-duration:8s;
    animation-delay:1s;
}

@keyframes caer{
    0%{
        transform:
            translateY(-30px)
            rotate(0deg);
        opacity:0;
    }

    10%{
        opacity:.9;
    }

    100%{
        transform:
            translateY(110vh)
            translateX(80px)
            rotate(720deg);
        opacity:0;
    }
}

/* ANIMACION DE APARICION */

@keyframes aparecer{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* CELULAR */

@media(max-width:600px){

    .contenedor{
        padding:10px;
        justify-content:center;
    }

    .titulo{
        margin-top:5px;
    }

    .titulo h1{
        font-size:32px;
    }

    .titulo p{
        font-size:15px;
    }

    .flor{
        transform:scale(.75);
        margin-top:-5px;
        margin-bottom:-25px;
    }

    .mensaje{
        width:94vw;
        padding:14px 17px;
    }

    .mensaje p{
        font-size:14px;
        line-height:1.45;
    }

    .feliz-dia{
        font-size:26px;
        margin-top:12px;
    }

    button{
        font-size:14px;
        padding:10px 20px;
    }

    .campo{
        height:65px;
    }

}

</style>
